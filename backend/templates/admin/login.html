{% extends "admin/login.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    /* ==========================================
       DESIGN TRAFIQ SOURCING FOR DJANGO ADMIN
       ========================================== */

    /* 1. Arrière-plan général bleu roi */
    body.login-page,
    .login-page {
        background-color: #2563eb !important; /* Bleu vif Trafiq */
        background-image: none !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 100vh !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    }

    /* 2. Fixation du double logo : Masquer le logo dark */
    .login-logo img.logo-dark {
        display: none !important;
    }

    /* Conteneur du logo transformé en vignette centrée dans la carte */
    .login-logo {
        margin-bottom: 0.5rem !important;
        text-align: center !important;
    }

    .login-logo img.logo-light,
    .login-logo img {
        display: inline-block !important;
        max-height: 38px !important;
        width: auto !important;
        background: #f1f5f9;
        padding: 6px 16px;
        border-radius: 8px;
        object-fit: contain !important;
    }

    /* 3. Carte de connexion principale (blanche & arrondie) */
    .login-box {
        width: 100% !important;
        max-width: 440px !important;
        margin: 0 auto !important;
    }

    .login-box .card,
    .card {
        background: #ffffff !important;
        border: none !important;
        border-radius: 16px !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
        padding: 24px 20px !important;
    }

    .login-card-body, .card-body {
        padding: 10px !important;
        background: transparent !important;
    }

    /* Personnalisation des titres */
    .login-box-msg {
        color: #1e293b !important;
        font-weight: 700 !important;
        font-size: 1.25rem !important;
        padding: 0 !important;
        margin-top: 8px !important;
        margin-bottom: 4px !important;
        text-align: center !important;
    }

    /* Sous-titre indicatif */
    .login-box-msg::after {
        content: "Connectez-vous pour accéder à votre espace";
        display: block;
        font-size: 0.85rem;
        font-weight: 400;
        color: #64748b;
        margin-top: 4px;
        margin-bottom: 16px;
    }

    /* 4. Champs de saisie (Inputs) */
    .form-control {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 8px !important;
        height: 44px !important;
        font-size: 0.95rem !important;
        color: #334155 !important;
        box-shadow: none !important;
    }

    .form-control:focus {
        border-color: #2563eb !important;
        background-color: #ffffff !important;
    }

    .input-group-text {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-left: none !important;
        border-radius: 0 8px 8px 0 !important;
        color: #94a3b8 !important;
    }

    .input-group .form-control {
        border-right: none !important;
        border-radius: 8px 0 0 8px !important;
    }

    /* 5. Bouton Se Connecter */
    .btn-primary,
    .login-box .btn-primary {
        background-color: #2563eb !important;
        border-color: #2563eb !important;
        border-radius: 8px !important;
        height: 44px !important;
        font-weight: 600 !important;
        font-size: 0.95rem !important;
        transition: all 0.2s ease-in-out !important;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2) !important;
    }

    .btn-primary:hover {
        background-color: #1d4ed8 !important;
        border-color: #1d4ed8 !important;
    }
</style>
{% endblock %}
